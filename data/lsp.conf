# Pluto LSP server configuration
#
# Each section defines a language server. The server binary must be
# installed on the system (checked at load time).
#
# Format:
#   [name]
#   command = /path/to/binary
#   args = --flag1 --flag2
#   extensions = .ext1, .ext2

[clangd]
command = /boot/system/bin/clangd
args = --background-index --offset-encoding=utf-8 --pch-storage=memory
extensions = .cpp, .h, .cc, .cxx, .hpp, .hxx, .c

[pylsp]
command = /boot/system/bin/pylsp
args = -v
extensions = .py

[gopls]
command = /boot/system/bin/gopls
args = serve
extensions = .go
