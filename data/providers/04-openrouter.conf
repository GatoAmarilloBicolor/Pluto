model = qwen/qwen3-72b:free, Qwen 3 72B (free), 4096, 131072
# Paid models
model = anthropic/claude-opus-4-6, Claude Opus 4.6, 128000, 1000000
model = anthropic/claude-sonnet-4-6, Claude Sonnet 4.6, 128000, 1000000
