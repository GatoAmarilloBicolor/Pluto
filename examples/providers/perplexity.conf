# Perplexity — search-augmented AI models
# Copy to ~/config/settings/pluto/providers/perplexity.conf

label = Perplexity
base_url = https://api.perplexity.ai
api_key_env = PERPLEXITY_API_KEY

# model = id, Display Name, max_tokens, context_window
model = sonar-pro, Sonar Pro, 8192, 200000
model = sonar, Sonar, 8192, 128000
model = sonar-reasoning-pro, Sonar Reasoning Pro, 8192, 128000
model = sonar-reasoning, Sonar Reasoning, 8192, 128000
