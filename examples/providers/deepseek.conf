# DeepSeek — strong coding models at low cost
# Copy to ~/config/settings/pluto/providers/deepseek.conf
#
# Get a key: https://platform.deepseek.com/api_keys
# Export: DEEPSEEK_API_KEY=sk-...

label = DeepSeek
base_url = https://api.deepseek.com
api_key_env = DEEPSEEK_API_KEY

# model = id, Display Name, max_tokens, context_window
model = deepseek-chat, DeepSeek V3, 8192, 64000
model = deepseek-reasoner, DeepSeek R1, 8192, 64000
