# Azure OpenAI — Microsoft Azure-hosted OpenAI models
# Copy to ~/config/settings/pluto/providers/azure-openai.conf
#
# IMPORTANT: Set base_url to YOUR Azure endpoint:
#   https://YOUR-RESOURCE.openai.azure.com/openai/v1
#
# Generate an API key in Azure Portal > your OpenAI resource > Keys

label = Azure OpenAI
base_url = https://YOUR-RESOURCE.openai.azure.com/openai/v1
api_key_env = AZURE_OPENAI_API_KEY

# model = id, Display Name, max_tokens, context_window
model = gpt-4o, GPT-4o, 16384, 128000
model = gpt-4.1, GPT-4.1, 32768, 1047576
model = o3-mini, o3 mini, 100000, 200000
