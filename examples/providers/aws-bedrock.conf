# AWS Bedrock — Amazon's managed AI model service
# Copy to ~/config/settings/pluto/providers/aws-bedrock.conf
#
# IMPORTANT: Set base_url to YOUR Bedrock region endpoint:
#   https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
#
# Generate a Bedrock API key in the AWS Console.
# Export: BEDROCK_API_KEY=your-bearer-token

label = AWS Bedrock
base_url = https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
api_key_env = AWS_BEARER_TOKEN_BEDROCK

# model = id, Display Name, max_tokens, context_window
model = anthropic.claude-sonnet-4-20250514-v1:0, Claude Sonnet 4, 8192, 200000
model = anthropic.claude-3-5-haiku-20241022-v1:0, Claude Haiku 3.5, 8192, 200000
model = meta.llama3-1-70b-instruct-v1:0, Llama 3.1 70B, 4096, 128000
model = mistral.mistral-large-2407-v1:0, Mistral Large, 8192, 32000
