# Fireworks AI — fast inference for open-source models
# Copy to ~/config/settings/pluto/providers/fireworks.conf

label = Fireworks AI
base_url = https://api.fireworks.ai/inference
api_key_env = FIREWORKS_API_KEY

# model = id, Display Name, max_tokens, context_window
model = accounts/fireworks/models/llama-v3p1-70b-instruct, Llama 3.1 70B, 4096, 131072
model = accounts/fireworks/models/llama-v3p1-8b-instruct, Llama 3.1 8B, 4096, 131072
model = accounts/fireworks/models/mixtral-8x22b-instruct, Mixtral 8x22B, 4096, 65536
