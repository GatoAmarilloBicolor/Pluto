# Groq — ultra-fast inference with free tier
# Copy to ~/config/settings/pluto/providers/groq.conf
#
# Get a free key: https://console.groq.com/keys
# Export: GROQ_API_KEY=gsk_...

label = Groq
base_url = https://api.groq.com/openai
api_key_env = GROQ_API_KEY

# model = id, Display Name, max_tokens, context_window
model = llama-3.3-70b-versatile, Llama 3.3 70B, 8192, 128000
model = llama-3.1-8b-instant, Llama 3.1 8B Instant, 8192, 128000
model = mixtral-8x7b-32768, Mixtral 8x7B, 4096, 32768
model = gemma2-9b-it, Gemma 2 9B, 4096, 8192
