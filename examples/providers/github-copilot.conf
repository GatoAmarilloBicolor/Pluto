# GitHub Copilot — models via GitHub Copilot subscription
# Copy to ~/config/settings/pluto/providers/github-copilot.conf
#
# Requires Copilot Pro or Business subscription.
# Use a GitHub personal access token with copilot scope,
# or a proxy like github.com/ericc-ch/copilot-api.
#
# Export: GITHUB_TOKEN=ghp_your-token

label = GitHub Copilot
base_url = https://api.githubcopilot.com
api_key_env = GITHUB_TOKEN

# model = id, Display Name, max_tokens, context_window
model = gpt-4o, GPT-4o, 16384, 128000
model = claude-3.5-sonnet, Claude Sonnet, 8192, 200000
model = o3-mini, o3 mini, 100000, 200000
