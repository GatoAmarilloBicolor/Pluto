# Mistral AI — European AI lab, strong coding models
# Copy to ~/config/settings/pluto/providers/mistral.conf
#
# Get API key at https://console.mistral.ai/
# Export: MISTRAL_API_KEY=your-key

label = Mistral AI
base_url = https://api.mistral.ai
api_key_env = MISTRAL_API_KEY

# model = id, Display Name, max_tokens, context_window
model = mistral-large-latest, Mistral Large, 8192, 128000
model = mistral-medium-latest, Mistral Medium, 8192, 32000
model = mistral-small-latest, Mistral Small, 8192, 32000
model = codestral-latest, Codestral, 16384, 32000
model = pixtral-large-latest, Pixtral Large (vision), 8192, 128000
