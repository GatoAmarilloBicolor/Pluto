# Cohere — Command R+ for RAG and tool use
# Copy to ~/config/settings/pluto/providers/cohere.conf
#
# Get a key: https://dashboard.cohere.com/api-keys
# Export: COHERE_API_KEY=your-key
#
# Note: Cohere uses a slightly different API but their v2 endpoint
# is OpenAI-compatible at /v2/chat/completions.

label = Cohere
base_url = https://api.cohere.com/compatibility/v1
api_key_env = COHERE_API_KEY

# model = id, Display Name, max_tokens, context_window
model = command-r-plus-08-2024, Command R+ (Aug 2024), 4096, 128000
model = command-r-08-2024, Command R (Aug 2024), 4096, 128000
model = command-a-03-2025, Command A, 8192, 256000
