# SambaNova — fast inference, free tier available
# Copy to ~/config/settings/pluto/providers/sambanova.conf
#
# Get a free key: https://cloud.sambanova.ai/
# Export: SAMBANOVA_API_KEY=your-key

label = SambaNova
base_url = https://api.sambanova.ai/v1
api_key_env = SAMBANOVA_API_KEY

# model = id, Display Name, max_tokens, context_window
model = Meta-Llama-3.3-70B-Instruct, Llama 3.3 70B, 8192, 128000
model = DeepSeek-R1-Distill-Llama-70B, DeepSeek R1 Distill 70B, 8192, 128000
model = Qwen2.5-72B-Instruct, Qwen 2.5 72B, 8192, 131072
