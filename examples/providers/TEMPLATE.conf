# Custom provider template for Pluto
#
# Copy this file to ~/config/settings/pluto/providers/<name>.conf
# and edit the values below. The provider will appear in the
# Preferences dialog under the built-in providers.
#
# Any server that implements POST /v1/chat/completions with SSE
# streaming (OpenAI-compatible format) will work.

# Display name shown in the Provider menu
label = My Provider

# Base URL of the API server (without /v1/chat/completions)
base_url = https://api.example.com

# Environment variable containing the API key (leave empty if not needed)
api_key_env = MY_PROVIDER_API_KEY

# Models available on this provider.
# Format: model = id, Display Name, max_tokens, context_window
#   id             — model identifier sent to the API
#   Display Name   — label shown in the model picker
#   max_tokens     — suggested max output tokens
#   context_window — model context size in tokens
model = model-name, Model Name, 4096, 128000
